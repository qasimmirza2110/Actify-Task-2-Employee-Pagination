spring.application.name=task-2-employee-pagination
server.port=8081

# ---------- PostgreSQL ----------
# EMPLOYEE_ prefix so this project never picks up DB_PASSWORD etc. that belong to other projects.
spring.datasource.url=${EMPLOYEE_DB_URL:jdbc:postgresql://localhost:5432/Actify-Internship-Task-2-Employee-Pagination_db}
spring.datasource.username=${EMPLOYEE_DB_USERNAME:postgres}
# If EMPLOYEE_DB_PASSWORD is not set, the PostgreSQL driver falls back to the user's pgpass.conf file.
spring.datasource.password=${EMPLOYEE_DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Employee API ----------
app.employee.max-page-size=100
# Inserts 7 sample employees when the table is empty. Off by default; turn on for a local demo.
app.seed-demo-data=${EMPLOYEE_SEED_DEMO_DATA:false}

# Used by the *IT integration tests (mvnw verify). Needs the Task 2 PostgreSQL test database.
spring.datasource.url=${EMPLOYEE_TEST_DB_URL:jdbc:postgresql://localhost:5432/financial_ledger_task2_test_db}
spring.datasource.username=${EMPLOYEE_TEST_DB_USERNAME:postgres}
spring.datasource.password=${EMPLOYEE_TEST_DB_PASSWORD:}
# Fresh schema for every test run.
spring.jpa.hibernate.ddl-auto=create-drop

# Tests insert their own rows.
app.seed-demo-data=false
